name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_SETTINGS_MODULE: mall_of_garhwa.settings.development
        run: python manage.py check

      - name: Check for missing migrations
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          DJANGO_SETTINGS_MODULE: mall_of_garhwa.settings.development
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest --cov=apps --cov-report=term-missing

  frontend-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin, vendor-panel, delivery-panel]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.app }}
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: ${{ matrix.app }}
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
